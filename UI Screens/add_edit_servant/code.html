<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a58255",
                        "background-light": "#f7f7f6",
                        "background-dark": "#1c1916",
                    },
                    fontFamily: {
                        "display": ["Work Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Work Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen font-display">
<div class="max-w-3xl mx-auto pb-12">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-primary/10 px-4 py-4 flex items-center justify-between">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary/10 text-primary transition-colors">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h1 class="text-xl font-bold tracking-tight">إضافة / تعديل خادم</h1>
</div>
<div class="flex gap-2">
<button class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-primary/5 rounded-lg transition-colors">إلغاء</button>
<button class="px-6 py-2 bg-primary text-white text-sm font-bold rounded-lg hover:bg-primary/90 shadow-sm transition-all">حفظ البيانات</button>
</div>
</header>
<main class="p-4 space-y-8">
<!-- Section 1: Basic Info -->
<section class="bg-white dark:bg-slate-900/50 rounded-xl p-6 border border-primary/10 shadow-sm">
<div class="flex items-center gap-3 mb-6">
<span class="material-symbols-outlined text-primary">person</span>
<h2 class="text-lg font-bold">المعلومات الأساسية</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="col-span-full">
<label class="block text-sm font-medium mb-2 opacity-80">الاسم الكامل</label>
<input class="w-full h-12 bg-background-light dark:bg-background-dark border-primary/20 rounded-lg focus:ring-primary focus:border-primary px-4" placeholder="أدخل اسم الخادم بالكامل" type="text"/>
</div>
<div>
<label class="block text-sm font-medium mb-2 opacity-80">رقم الهاتف</label>
<input class="w-full h-12 bg-background-light dark:bg-background-dark border-primary/20 rounded-lg focus:ring-primary focus:border-primary px-4 text-right" dir="ltr" placeholder="01xxxxxxxxx" type="tel"/>
</div>
<div>
<label class="block text-sm font-medium mb-2 opacity-80">البريد الإلكتروني</label>
<input class="w-full h-12 bg-background-light dark:bg-background-dark border-primary/20 rounded-lg focus:ring-primary focus:border-primary px-4 text-right" dir="ltr" placeholder="example@church.com" type="email"/>
</div>
<div>
<label class="block text-sm font-medium mb-2 opacity-80">كلمة المرور</label>
<div class="relative">
<input class="w-full h-12 bg-background-light dark:bg-background-dark border-primary/20 rounded-lg focus:ring-primary focus:border-primary px-4" placeholder="••••••••" type="password"/>
<button class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div>
<label class="block text-sm font-medium mb-2 opacity-80">الدور الوظيفي</label>
<select class="w-full h-12 bg-background-light dark:bg-background-dark border-primary/20 rounded-lg focus:ring-primary focus:border-primary px-4 appearance-none">
<option>خادم</option>
<option>أمين خدمة</option>
<option>أمين مساعد</option>
<option>مسؤول تقني</option>
</select>
</div>
</div>
</section>
<!-- Section 2: Service Details -->
<section class="bg-white dark:bg-slate-900/50 rounded-xl p-6 border border-primary/10 shadow-sm">
<div class="flex items-center gap-3 mb-6">
<span class="material-symbols-outlined text-primary">church</span>
<h2 class="text-lg font-bold">تفاصيل الخدمة</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>
<label class="block text-sm font-medium mb-2 opacity-80">المرحلة الدراسية / المجموعة</label>
<select class="w-full h-12 bg-background-light dark:bg-background-dark border-primary/20 rounded-lg focus:ring-primary focus:border-primary px-4 appearance-none">
<option>ابتدائي</option>
<option>إعدادي</option>
<option>ثانوي</option>
<option>جامعيين</option>
<option>خريجين</option>
</select>
</div>
<div>
<label class="block text-sm font-medium mb-2 opacity-80">أب الاعتراف</label>
<input class="w-full h-12 bg-background-light dark:bg-background-dark border-primary/20 rounded-lg focus:ring-primary focus:border-primary px-4" placeholder="اسم الأب الكاهن" type="text"/>
</div>
</div>
</section>
<!-- Section 3: Additional Info -->
<section class="bg-white dark:bg-slate-900/50 rounded-xl p-6 border border-primary/10 shadow-sm">
<div class="flex items-center gap-3 mb-6">
<span class="material-symbols-outlined text-primary">info</span>
<h2 class="text-lg font-bold">معلومات إضافية</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div>
<label class="block text-sm font-medium mb-2 opacity-80">تاريخ الميلاد</label>
<input class="w-full h-12 bg-background-light dark:bg-background-dark border-primary/20 rounded-lg focus:ring-primary focus:border-primary px-4" type="date"/>
</div>
<div>
<label class="block text-sm font-medium mb-2 opacity-80">العنوان</label>
<input class="w-full h-12 bg-background-light dark:bg-background-dark border-primary/20 rounded-lg focus:ring-primary focus:border-primary px-4" placeholder="شارع، منطقة، مدينة" type="text"/>
</div>
<div class="col-span-full">
<label class="block text-sm font-medium mb-2 opacity-80">رابط الصورة الشخصية</label>
<div class="flex gap-4">
<div class="w-16 h-16 rounded-full bg-primary/10 border-2 border-dashed border-primary/30 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary/50">add_a_photo</span>
</div>
<input class="flex-1 h-12 bg-background-light dark:bg-background-dark border-primary/20 rounded-lg focus:ring-primary focus:border-primary px-4 text-right" dir="ltr" placeholder="https://example.com/photo.jpg" type="url"/>
</div>
</div>
<div class="col-span-full">
<label class="block text-sm font-medium mb-2 opacity-80">ملاحظات</label>
<textarea class="w-full bg-background-light dark:bg-background-dark border-primary/20 rounded-lg focus:ring-primary focus:border-primary p-4 resize-none" placeholder="أدخل أي ملاحظات إضافية هنا..." rows="4"></textarea>
</div>
</div>
</section>
<!-- Bottom Actions Mobile Only (Hidden on Desktop because of header) -->
<div class="flex flex-col gap-3 pt-4 md:hidden">
<button class="w-full py-4 bg-primary text-white font-bold rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
                    حفظ بيانات الخادم
                </button>
<button class="w-full py-4 bg-primary/10 text-primary font-medium rounded-xl active:scale-[0.98] transition-all">
                    إلغاء التعديلات
                </button>
</div>
</main>
</div>
</body></html>
