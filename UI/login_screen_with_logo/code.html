<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&amp;family=Noto+Sans+Arabic:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#a58255",
                        "background-light": "#f7f7f6",
                        "background-dark": "#1c1916",
                    },
                    fontFamily: {
                        "display": ["Noto Sans Arabic", "Work Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Noto Sans Arabic', 'Work Sans', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white dark:bg-zinc-900 rounded-xl shadow-xl overflow-hidden border border-primary/10">
<!-- Header / Logo Section -->
<div class="flex flex-col items-center pt-10 pb-6 px-6 bg-primary/5">
<div class="rounded-full mb-4"><img alt="Church Logo" class="w-32 h-32 object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0uhbSdzajIn2eg9-Fj9QxrG5p-C6NWAprrmKjezYxji9_VgRkV9ZzxqdFOXTBmCpmfc1VSS-IXbZEEyffCkAjjfWuz9jb80uqqcqf_xNdkqpOFF1TVRbfvCKBcrKzZJHLAjHZ4NtyJyYH3PjuLByqCZx3gfbPz01Z5R3qtOAwZOT-FckyN4WKMFDSd05Regk70uqtlSfzhtLznxVYulBTv7fzVZhbUt1aKMQopbsHl0OlUSwPzTolcxBE4IUjfDpom8JgZJFtq-Hgr8"/></div>
<h1 class="text-2xl font-bold text-slate-900 dark:text-white">نظام إدارة الكنيسة</h1>
<p class="text-slate-500 dark:text-slate-400 mt-2 text-sm">مرحباً بك مجدداً، يرجى تسجيل الدخول</p>
</div>
<!-- Form Section -->
<div class="p-8">
<form class="space-y-6" onsubmit="return false;">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mr-1">البريد الإلكتروني</label>
<div class="relative group">
<div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-primary">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pr-11 pl-4 py-3.5 bg-background-light dark:bg-zinc-800 border border-primary/20 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 text-slate-900 dark:text-white placeholder:text-slate-400" placeholder="example@church.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300">كلمة المرور</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">نسيت كلمة المرور؟</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-primary">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pr-11 pl-12 py-3.5 bg-background-light dark:bg-zinc-800 border border-primary/20 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 text-slate-900 dark:text-white" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center px-1">
<input class="w-4 h-4 text-primary border-primary/30 rounded focus:ring-primary bg-background-light dark:bg-zinc-800" id="remember" type="checkbox"/>
<label class="mr-2 text-sm text-slate-600 dark:text-slate-400" for="remember">تذكرني على هذا الجهاز</label>
</div>
<!-- Login Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-lg shadow-lg shadow-primary/30 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
<span>تسجيل الدخول</span>
<span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-10 text-center">
<p class="text-slate-600 dark:text-slate-400 text-sm">
                    ليس لديك حساب؟ 
                    <a class="text-primary font-bold hover:underline mr-1" href="#">إنشاء حساب جديد</a>
</p>
</div>
</div>
<!-- Design Accent -->
<div class="h-1.5 w-full bg-gradient-to-l from-primary via-primary/60 to-primary/20"></div>
</div>
<!-- Decorative Background Elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none opacity-20">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary rounded-full blur-[100px]"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-primary rounded-full blur-[100px]"></div>
</div>
</body></html>
